[package]
name = "raea-sys-ml"
version = "0.1.0"
edition = "2024"
publish = false
description = "raea's ONNX Runtime facility: models loaded once per process and run on tensors from Rust or from a composition's TypeScript, and jobs named by what they compute"
license = "FSL-1.1-ALv2"

[features]
# Core ML as an execution provider (display-only results: not bit-exact across runs or machines)
coreml = ["ort/coreml"]

[dependencies]
dunce = "1"
raea-io-home = { path = "../../io/home" }
# the same ort pin and prebuilt runtime as the legacy app's voice and raea's perception
ort = { version = "=2.0.0-rc.13", features = ["half"] }
half = "2"
anyhow = "1"
# models fetched once from Hugging Face into the model cache (models.rs)
ureq = "2"

# Windows x64: ONNX Runtime is loaded from onnxruntime.dll beside the executable when a model first runs, never linked
# in (#110; tools/release/onnxruntime.sh ships Microsoft's build). The static runtime ort downloads is built for AVX2, and
# its static initializers ran before main, so raea.exe stopped at start on any CPU without AVX2 or BMI2.
[target.'cfg(all(target_arch = "x86_64", any(windows, target_os = "macos")))'.dependencies]
ort = { version = "=2.0.0-rc.13", features = ["load-dynamic"] }
