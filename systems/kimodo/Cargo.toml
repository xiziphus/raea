[package]
name = "raea-sys-kimodo"
version = "0.1.0"
edition = "2024"
publish = false
description = "Kimodo (nv-tlabs/kimodo) on raea's MLX facility: SOMA body motion from a line of text and constraints, made on this Mac"
license = "FSL-1.1-ALv2"

[dependencies]
# a path handed to Python without Windows' \\?\ prefix
dunce = "1"
anyhow = "1"
serde_json = "1"

# the networks run on MLX, Apple silicon's: elsewhere the crate is its plain-Rust parts (the skeleton, the constraints,
# features to joints, the clip file)
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
raea-sys-mlx = { path = "../mlx" }
raea-sys-ml = { path = "../ml" }
mlx-rs = "=0.34.0"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

[dev-dependencies]
raea-io-home = { path = "../../io/home" }
