[package]
name = "raea-sys-index"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "Index's fast pass (docs/index.feature IX1-IX3): every picture, and a few frames of every video, listed, decoded from its small copy and embedded by SigLIP 2 on the Neural Engine, kept as f16 rows beside a SQLite list, and searched by words through SigLIP 2's text tower"

[dependencies]
anyhow = "1"
dunce = "1"
half = "2"
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the text tower: ONNX on ONNX Runtime's CPU kernels, as raea's other encoders
raea-sys-ml = { path = "../ml" }
# the models folder and the index home, as raea names them
raea-io-home = { path = "../../io/home" }
ort = { version = "=2.0.0-rc.13", features = ["half"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
walkdir = "2"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSError", "NSDictionary", "NSArray", "NSValue", "NSDate"] }
objc2-core-foundation = { version = "0.3", features = ["CFString", "CFDictionary", "CFNumber", "CFURL", "CFData"] }
objc2-core-ml = { version = "0.3", features = ["MLModel", "MLModelConfiguration", "MLFeatureProvider", "MLDictionaryFeatureProvider", "MLFeatureValue", "MLMultiArray", "MLModel_MLModelCompilation", "MLArrayBatchProvider", "MLBatchProvider", "objc2-core-video"] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGColorSpace", "CGContext", "CGBitmapContext"] }
objc2-image-io = { version = "0.3", features = ["CGImageSource", "CGImageDestination", "CGImageProperties"] }
# a video's keyframes (frames.rs)
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-graphics"] }
objc2-core-media = "0.3"
# Apple Photos (photos.rs): its assets and the small copies it keeps of each, so iCloud Photos indexes from this Mac
objc2-photos = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-app-kit", "PHAsset", "PHFetchResult", "PHFetchOptions", "PHImageManager", "PHPhotoLibrary", "PHAssetResource", "PhotosTypes", "PHObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSGraphicsContext", "objc2-core-graphics"] }
block2 = "0.6"
# a file kept only in iCloud (cloud.rs): its picture from Quick Look, without downloading the original
objc2-quick-look-thumbnailing = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "QLThumbnailGenerator", "QLThumbnailGenerationRequest", "QLThumbnailRepresentation"] }

# Windows x64: ONNX Runtime is loaded from onnxruntime.dll beside the executable when a model first runs, never linked
# in (#110; tools/release/onnxruntime.sh ships Microsoft's build). The static runtime ort downloads is built for AVX2, and
# its static initializers ran before main, so raea.exe stopped at start on any CPU without AVX2 or BMI2.
[target.'cfg(all(target_arch = "x86_64", any(windows, target_os = "macos")))'.dependencies]
ort = { version = "=2.0.0-rc.13", features = ["load-dynamic"] }
